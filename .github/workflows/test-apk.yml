name: Test APK

# Builds an Android APK for trying the app on a phone before release.
# Download it from the run's "Artifacts" section.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # TEST_BUILD shows the "Pro (test build)" switch so every feature can
      # be tried without store purchases.
      - run: flutter build apk --release --dart-define=TEST_BUILD=true
      - uses: actions/upload-artifact@v4
        with:
          name: grimstock-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
